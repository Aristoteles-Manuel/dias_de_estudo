<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dia 9 — Contagem de 1 a 100</title>
</head>
<body>
    <h1>contagem</h1>
    <div id="res">Resultado:</div>
    <script>
        var res =window.document.getElementById('res')
        
        for(var c = 1; c<=100; c++){
             res.innerHTML+=` - ${c}`
        }
        

    </script>
    <script data-goatcounter="https://aristoteles.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
