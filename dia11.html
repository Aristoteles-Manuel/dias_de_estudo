    <title>Dia 11 — Calculadora</title>

    <style>
/* ==========================================================
   PALETA — teoria das cores
   Cor base: violeta (matiz ~255°)
   • Análogas: azul-índigo 225° e magenta 295° (profundidade, sem quebrar a harmonia)
   • Acento (split-complementar do violeta): âmbar 45° → contraste quente
   Regra 60-30-10:
     60% violetas escuros (fundo + corpo)
     30% índigo / magenta (teclas, brilhos)
     10% âmbar (dígitos do ecrã + botão calcular)
   ========================================================== */
:root {
  --violeta-950: #0d0a26;
  --violeta-900: #14102e;
  --violeta-500: #5b3fd1;
  --indigo-400:  #5f78ff;
  --magenta-500: #b04fe0;
  --ambar-400:   #ffc24b;
  --ambar-600:   #c98a18;
  --tinta:       #1b1240;
}

* { box-sizing: border-box; margin: 0; }

body {
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 16px;
  overflow: hidden;
  font-family: "Poppins", system-ui, sans-serif;
  color: #efeaff;
  background:
    radial-gradient(ellipse at 50% 38%, rgba(91, 63, 209, .55), transparent 60%),
    radial-gradient(ellipse at 15% 90%, rgba(176, 79, 224, .35), transparent 50%),
    radial-gradient(ellipse at 90% 10%, rgba(95, 120, 255, .35), transparent 50%),
    linear-gradient(160deg, var(--violeta-900), var(--violeta-950));
}

body::before,
body::after {
  content: "";
  position: fixed;
  width: 55vmax;
  height: 55vmax;
  border-radius: 50%;
  filter: blur(80px);
  opacity: .35;
  z-index: 0;
  animation: deriva 14s ease-in-out infinite alternate;
}
body::before { background: var(--magenta-500); top: -25vmax; left: -20vmax; }
body::after  { background: var(--indigo-400);  bottom: -28vmax; right: -22vmax; animation-delay: -7s; }

@keyframes deriva { to { transform: translate(6vmax, 4vmax) scale(1.1); } }

.simbolos span {
  position: fixed;
  font-weight: 700;
  color: var(--ambar-400);
  opacity: .12;
  z-index: 0;
  animation: flutua 9s ease-in-out infinite alternate;
  user-select: none;
}
.simbolos span:nth-child(1) { left: 8%;  top: 14%; font-size: 64px; }
.simbolos span:nth-child(2) { right: 10%; top: 22%; font-size: 90px; animation-delay: -3s; }
.simbolos span:nth-child(3) { left: 14%; bottom: 16%; font-size: 80px; animation-delay: -5s; }
.simbolos span:nth-child(4) { right: 12%; bottom: 12%; font-size: 56px; animation-delay: -2s; }
.simbolos span:nth-child(5) { left: 46%; top: 4%;  font-size: 48px; animation-delay: -6s; }

@keyframes flutua { to { transform: translateY(-22px) rotate(8deg); } }

.so-leitor {
  position: absolute;
  width: 1px; height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* ---------- Calculadora ---------- */
.calc {
  position: relative;
  z-index: 1;
  width: min(92vw, 400px, calc((100svh - 32px) * 0.625));
  aspect-ratio: 400 / 640;
  container-type: inline-size;   /* cqw: tudo escala com a calculadora */
}

.calc > img,
.calc > svg {
  display: block;
  width: 100%;
  height: 100%;
  filter:
    drop-shadow(0 30px 40px rgba(5, 3, 20, .55))
    drop-shadow(0 0 40px rgba(95, 120, 255, .25));
  pointer-events: none;
  user-select: none;
}

/* ---------- Inputs no ecrã ---------- */
.ecra {
  position: absolute;
  left: 12%;
  top: 9.06%;
  width: 76%;
  height: 29.4%;
  padding: 4.5cqw 4cqw 3cqw;
  display: grid;
  grid-template-columns: 1fr .75fr 1fr;
  grid-template-rows: auto 1fr;
  gap: 2.5cqw;
}

.ecra input {
  width: 100%;
  min-width: 0;
  padding: 1.5cqw 1cqw;
  font: 600 6cqw/1.2 "Share Tech Mono", ui-monospace, monospace;
  color: var(--ambar-400);
  background: transparent;
  border: 0;
  border-bottom: .6cqw solid rgba(255, 194, 75, .35);
  border-radius: 0;
  outline: none;
  text-align: right;
  transition: border-color .2s, box-shadow .2s;
  -moz-appearance: textfield;
}
.ecra #sinal { text-align: center; }

.ecra input::placeholder { color: rgba(255, 194, 75, .4); }
.ecra input::-webkit-outer-spin-button,
.ecra input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

.ecra input:focus {
  border-bottom-color: var(--ambar-400);
  box-shadow: 0 .8cqw 2cqw -1cqw rgba(255, 194, 75, .6);
}

/* resultado e mensagens (cabem em 2 linhas) */
.ecra #resultado {
  grid-column: 1 / -1;
  align-self: end;
  text-align: right;
  font: 700 10cqw/1.1 "Share Tech Mono", ui-monospace, monospace;
  color: var(--ambar-400);
  text-shadow: 0 0 3cqw rgba(255, 194, 75, .55);
  overflow-wrap: anywhere;
  overflow: hidden;
}

/* ---------- Botão calcular: centrado, em baixo ---------- */
.calc input[type="button"] {
  position: absolute;
  left: 50%;
  top: 84.4%;
  width: 60%;
  height: 8.75%;
  transform: translateX(-50%);
  border: 0;
  border-radius: 999px;
  font: 700 5cqw/1 "Poppins", system-ui, sans-serif;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--tinta);
  background: linear-gradient(180deg, #ffd47a, var(--ambar-400));
  box-shadow:
    0 1.4cqw 0 var(--ambar-600),
    0 3cqw 5cqw rgba(255, 194, 75, .35);
  cursor: pointer;
  transition: transform .08s, box-shadow .08s, filter .2s;
}
.calc input[type="button"]:hover  { filter: brightness(1.06); }
.calc input[type="button"]:active {
  transform: translateX(-50%) translateY(1cqw);
  box-shadow: 0 .4cqw 0 var(--ambar-600), 0 1.5cqw 3cqw rgba(255, 194, 75, .3);
}
.calc input[type="button"]:focus-visible {
  outline: .8cqw solid #fff;
  outline-offset: 1cqw;
}

@media (prefers-reduced-motion: reduce) {
  body::before, body::after, .simbolos span { animation: none; }
}

    </style>

            <input type="number" name="n1" id="n1" placeholder="0" aria-label="Primeiro número">
            <input type="text" name="sinal" id="sinal" placeholder="+-x/" maxlength="1" aria-label="Sinal da operação">
            <input type="number" name="n2" id="n2" placeholder="0" aria-label="Segundo número">
            <div id="resultado">0</div>
        </div>

        <input type="button" value="calcular" onclick="executar()">

    <script>
let num1= document.querySelector('input#n1')
let num2 = document.querySelector('input#n2')
let sinal1 = document.querySelector('input#sinal')
let res = document.querySelector('div#resultado')

function calcular(a,b,operacao){
    return operacao(a,b)
    }


function somar(a,b){
    return a+b
}
function subtrair(a,b){
    return a-b
}
function multiplicar(a,b){
    return a*b
}
function divisao(a,b){
    return a/b
}
function sinal(tipo){
    if(tipo=='+'){
        return somar
    }else if(tipo== '-'){
        return subtrair
    }else if(tipo=='x'){
        return multiplicar
    }else if (tipo== '/'){
        return divisao
    }else if(tipo=== ''){
        res.innerHTML=`escolha uma operação`
    }else{
        alert('sinal inválido use um dos seguintes (+, -, x, /)')
    }
}
function executar(){
    let n1=Number(num1.value)
    let n2=Number(num2.value)
    if(num1.value=='' && num2.value==''){
        res.innerHTML=`Digite os dois números`
        return
    }else if(num1.value==''){
        res.innerHTML=`Digite o 1º número`
        return
    }else if(num2.value==''){
        res.innerHTML=`Digite o 2º número`
        return
    }

    let tipo = sinal1.value
    let operacao = sinal(tipo)
    if(!operacao){
        return
    }
    if(operacao==divisao && n2==0){
        res.innerHTML=`Não dá para dividir por 0`
        return
    }
    let resultado = calcular(n1,n2,operacao)

    res.innerHTML=`${resultado}`

}

    </script>
