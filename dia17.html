<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dia 17 — Hora do Dia</title>
<style>
body{
  font-family: Arial, Helvetica, sans-serif;
  background-color: rgba(11, 87, 228, 0.795);
}
header{
  text-align: center;
  color: white;
}
section{
  background-color: white;
  padding: 25px 15px;
  max-width: 500px;
  border-radius: 10px;
  margin: auto;
}
button{
  font-size: 18px;
  padding: 10px 16px;
  cursor: pointer;
}
#res{
  margin-top: 18px;
  font-size: 22px;
  font-weight: bold;
  min-height: 30px;
}
footer{
  text-align: center;
  color: white;
  font-style: italic;
}
</style>
</head>
<body>
<header>
  <h1>Hora do Dia</h1>
</header>
<section>
  <button id="btn">Quantas horas são?</button>
  <div id="res"></div>
</section>
<footer><p>&copy; Aristóteles M. Sites</p></footer>
<script>
const btn = document.querySelector('#btn')
btn.addEventListener('click', executar)

function executar() {
  let res = document.querySelector('div#res')
  let agora = new Date()
  let hora = agora.getHours()
  res.innerHTML = (` São ${hora} horas `)
  switch (true) {
    case hora < 12:
      res.innerHTML += (`Bom Dia`)
      break
    case hora >= 12 && hora <= 17:
      res.innerHTML += (`Boa Tarde`)
      break
    case hora >= 18 && hora < 24:
      res.innerHTML += (`Boa Noite`)
  }
}
</script>
<script data-goatcounter="https://aristoteles.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
