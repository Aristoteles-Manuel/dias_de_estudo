<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dia 12 — Tabuada</title>
    <style>
body {
    text-align: center;
    font-family: Arial, Helvetica, sans-serif;
}
main {
    background-color: #F2D8C9;
    width: 100%;
    max-width: 500px;
    margin: 20px auto;
    padding: 15px;
    box-sizing: border-box;
    text-align: center;
    border-radius: 10px;
}
div#res {
    background-color: rgb(69, 37, 37);
    border: 1px solid rgba(0, 0, 0, 0.459);
    border-radius: 10px;
    color: white;
    padding: 10px;
    margin-top: 15px;
}
    </style>
</head>
<body>
    <main>
        <h1>Tabuada</h1>
        <p>Escolha um número:</p>
        <input type="number" name="num" id="tnum">
        <p>Escolha o início da tabuada:</p>
        <input type="number" name="inicio" id="tinicio">
        <p>Escolha o final da tabuada:</p>
        <input type="number" name="fim" id="tfim"><br>
        <button id="btn">Mostrar</button>
        <div id="res">Resultado: <br></div>
    </main>

    <script>
const btn = window.document.querySelector('button#btn')
btn.addEventListener('click', mostrar)

function mostrar() {
  let num = window.document.querySelector('input#tnum')
  let inicio = window.document.querySelector('input#tinicio')
  let fim = window.document.querySelector('input#tfim')
  let res = window.document.querySelector('div#res')
  if (num.value === '' || inicio.value === '' || fim.value === '') {
    alert('[ERRO] Preenche os três campos.')
    return
  }
  let n = Number(num.value)
  let i = Number(inicio.value)
  let f = Number(fim.value)
  if (i > f) {
    alert('[ERRO] O final é menor que o início.')
    return
  }
  let linhas = ''
  for (let c = i; c <= f; c++) {
    linhas += `${n} X ${c} = ${c * n} <br>`
  }
  res.innerHTML = linhas
  num.value = ''
  inicio.value = ''
  fim.value = ''
}
    </script>
<script data-goatcounter="https://aristoteles.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
